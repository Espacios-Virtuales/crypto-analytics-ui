<div class="container py-4">
    <h2>Health</h2>
    <p class="text-muted">Prueba mínima de conexión con la API.</p>
  
    <button class="btn btn-primary" (click)="check()" [disabled]="loading">
      {{ loading ? 'Probando...' : 'Probar conexión' }}
    </button>
  
    <div class="mt-3" *ngIf="status !== 'idle'">
      <div class="alert" [class.alert-success]="status==='ok'" [class.alert-danger]="status==='fail'">
        <strong>{{ message }}</strong>
      </div>
  
      <pre class="bg-light p-3 rounded small">{{ details | json }}</pre>
    </div>
  </div>
