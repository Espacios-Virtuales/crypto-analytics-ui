<div
  class="ev-shell d-flex"
  [class.mobile]="isMobile()"
  [class.sidebar-open]="isSidebarOpen()"
>
  <!-- Backdrop mobile -->
  <div
    class="ev-backdrop"
    *ngIf="isMobile() && isSidebarOpen()"
    (click)="closeSidebar()"
  ></div>

  <!-- Sidebar / drawer -->
  <aside
    class="ev-sidebar"
    [class.open]="isSidebarOpen()"
    [class.collapsed]="!isMobile() && !isSidebarOpen()"
  >
    <div class="brand px-3 py-3">
      <a
        routerLink="/dashboard"
        class="brand-link"
        (click)="isMobile() ? closeSidebar() : null"
      >
        <i class="bi bi-house-fill"></i>
      </a>
    </div>

    <nav class="menu">
      <a
        routerLink="/dashboard"
        class="menu-item"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="isMobile() ? closeSidebar() : null"
      >
        <i class="bi bi-speedometer2"></i>
        <span>Resumen</span>
      </a>
      <a
        routerLink="/dashboard/history"
        class="menu-item"
        routerLinkActive="active"
        (click)="isMobile() ? closeSidebar() : null"
      >
        <i class="bi bi-graph-up"></i>
        <span>Históricos</span>
      </a>
      <a
        routerLink="/dashboard/compare"
        class="menu-item"
        routerLinkActive="active"
        (click)="isMobile() ? closeSidebar() : null"
      >
        <i class="bi bi-bar-chart-line"></i>
        <span>Comparador</span>
      </a>
      <a
        routerLink="/dashboard/trading"
        class="menu-item"
        routerLinkActive="active"
        (click)="isMobile() ? closeSidebar() : null"
      >
        <i class="bi bi-lightning-charge"></i>
        <span>Trading Mode</span>
      </a>
    </nav>

    <!-- 🌑 Footer / Ajustes -->
    <div class="sidebar-footer">
      <a
        routerLink="/dashboard/assets"
        class="menu-item"
        routerLinkActive="active"
        (click)="isMobile() ? closeSidebar() : null"
      >
        <i class="bi bi-gear"></i>
        <span>Ajustes</span>
      </a>
    </div>
  </aside>

  <!-- Main -->
  <div class="ev-main flex-grow-1 d-flex flex-column">
    <header class="ev-topbar d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-2">
        <button
          class="btn btn-outline-secondary btn-sm hamburger d-lg-none"
          type="button"
          (click)="toggleSidebar()"
          aria-label="Abrir menú"
        >
          <i class="bi bi-list fs-4"></i>
        </button>

        <button
          class="btn btn-link toggle d-none d-lg-inline-flex text-dark"
          type="button"
          (click)="toggleSidebar()"
          aria-label="Alternar sidebar"
        >
          <i
            class="bi"
            [ngClass]="isSidebarOpen() ? 'bi-layout-sidebar-inset' : 'bi-layout-sidebar'"
          ></i>
        </button>
      </div>

      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="small text-muted d-none d-sm-inline">
          Hola,
          <strong>{{ email() || '—' }}</strong>
          <ng-container *ngIf="primaryRole() as r">
            <span class="ms-2 badge bg-light text-dark">{{ r }}</span>
          </ng-container>
        </span>

        <button class="btn btn-outline-secondary btn-sm" type="button" (click)="openUserModal()">
          <i class="bi bi-person-circle"></i>
        </button>
      </div>
    </header>

    <main class="ev-content container-fluid">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<dialog id="userDlg" class="ev-dialog">
  <form method="dialog">
    <h3 class="h6 mb-3">Cuenta</h3>

    <div class="vstack gap-1 small">
      <div><span class="text-muted">Email:</span> <strong>{{ email() || '—' }}</strong></div>
      <div>
        <span class="text-muted">Roles:</span>
        <strong>{{ (session()?.roles || []).join(', ') || '—' }}</strong>
      </div>
      <div>
        <span class="text-muted">Conectado desde:</span>
        <strong>{{ formatDate(connectedAt()) }}</strong>
      </div>
    </div>

    <div class="d-flex justify-content-between mt-4">
      <button class="btn btn-light" type="button" (click)="closeUserModal()" value="close">
        Cerrar
      </button>
      <button class="btn btn-danger" type="button" (click)="logout(); closeUserModal()">
        Cerrar sesión
      </button>
    </div>
  </form>
</dialog>
