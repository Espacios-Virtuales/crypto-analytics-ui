<div class="card shadow-sm line-chart-card">
  <div class="card-header line-chart-header">
    <div class="chart-title">
      <strong>{{ title }}</strong>
    </div>

    <div class="chart-legend">
      <div class="legend-item">
        <span class="legend-swatch legend-swatch-a"></span>
        <span class="legend-label">{{ seriesAName }}</span>
      </div>

      <div class="legend-item" *ngIf="seriesB.length">
        <span class="legend-swatch legend-swatch-b"></span>
        <span class="legend-label">{{ seriesBName }}</span>
      </div>
    </div>
  </div>

  <div class="card-body">
    <ng-container *ngIf="hasData; else emptyTpl">
      <svg
        [attr.viewBox]="'0 0 ' + width + ' ' + height"
        class="w-100"
        preserveAspectRatio="none"
        [style.height.px]="height"
      >
        <!-- grid + labels eje Y -->
        <ng-container *ngFor="let tick of yTicks()">
          <line
            [attr.x1]="chartLeft()"
            [attr.y1]="pointY(tick)"
            [attr.x2]="chartRight()"
            [attr.y2]="pointY(tick)"
            stroke="rgba(0,0,0,0.06)"
            stroke-width="1"
          />
          <text
            [attr.x]="chartLeft() - 8"
            [attr.y]="pointY(tick) + 4"
            text-anchor="end"
            font-size="10"
            fill="currentColor"
            opacity="0.7"
          >
            {{ formatTick(tick) }}
          </text>
        </ng-container>

        <!-- línea base inferior -->
        <line
          [attr.x1]="chartLeft()"
          [attr.y1]="chartBottom()"
          [attr.x2]="chartRight()"
          [attr.y2]="chartBottom()"
          stroke="rgba(0,0,0,0.08)"
          stroke-width="1"
        />

        <!-- serie A -->
        <polyline
          *ngIf="seriesA.length > 1"
          [attr.points]="toPolyline(seriesA)"
          fill="none"
          stroke="#111827"
          stroke-width="2.25"
        />

        <!-- serie B -->
        <polyline
          *ngIf="seriesB.length > 1"
          [attr.points]="toPolyline(seriesB)"
          fill="none"
          stroke="#2563eb"
          stroke-width="2.25"
        />

        <!-- puntos serie A -->
        <circle
          *ngFor="let point of seriesA; let i = index"
          [attr.cx]="pointX(i, seriesA.length)"
          [attr.cy]="pointY(point.value)"
          r="2.4"
          fill="#111827"
        />

        <!-- puntos serie B -->
        <circle
          *ngFor="let point of seriesB; let i = index"
          [attr.cx]="pointX(i, seriesB.length)"
          [attr.cy]="pointY(point.value)"
          r="2.4"
          fill="#2563eb"
        />

        <!-- labels eje X -->
        <ng-container *ngFor="let tick of xTicks()">
          <text
            [attr.x]="pointX(tick.index, seriesA.length || seriesB.length)"
            [attr.y]="height - 8"
            font-size="10"
            text-anchor="middle"
            fill="currentColor"
            opacity="0.7"
          >
            {{ tick.label }}
          </text>
        </ng-container>
      </svg>
    </ng-container>

    <ng-template #emptyTpl>
      <div class="text-muted">Sin datos suficientes para graficar.</div>
    </ng-template>
  </div>
</div>
